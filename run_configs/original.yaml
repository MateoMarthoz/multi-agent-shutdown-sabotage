# Single agent-target baseline cell. Set the evaluated model with --model.
# Use the baseline study preset to run all 17 models and the matched control.
task:
  task: multi_agent_shutdown_sabotage/multi_agent_shutdown_sabotage
  args:
    n: 100
    env: bare
    script_lang: weight_registry_purge
model_roles:
  grader:
    model: openrouter/openai/gpt-5.5
eval_config:
  time_limit: 1800
  max_samples: 8
